<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470"><rect width="1280" height="470" fill="#f5f5ec"/><g font-family="Arial,sans-serif" fill="#193d35"><text x="40" y="48" font-size="28" font-weight="bold">LOCAL RAG: FROM SUPPLIER DOCUMENTS TO A REVIEWABLE DECISION</text><text x="40" y="82" font-size="18">Evidence is isolated by supplier. Inference and embeddings run on the same computer.</text><g fill="#ffffff" stroke="#a7bda9" stroke-width="2"><rect x="40" y="120" width="230" height="150" rx="10"/><rect x="300" y="120" width="230" height="150" rx="10"/><rect x="560" y="120" width="230" height="150" rx="10"/><rect x="820" y="120" width="190" height="150" rx="10"/><rect x="1040" y="120" width="200" height="150" rx="10"/></g><g font-size="20" font-weight="bold"><text x="58" y="154">Extract and index</text><text x="318" y="154">Retrieve evidence</text><text x="578" y="154">Generate locally</text><text x="838" y="154">Validate citations</text><text x="1058" y="154">Human decision</text></g><g font-size="17"><text x="58" y="190">PDF text / scans / OCR</text><text x="58" y="219">Pages + document hashes</text><text x="58" y="248">Private SQLite index</text><text x="318" y="190">BM25 + local embeddings</text><text x="318" y="219">Rank fusion; top 6 passages</text><text x="318" y="248">One supplier pack only</text><text x="578" y="190">Open Weight LLM</text><text x="578" y="219">LM Studio loopback API</text><text x="578" y="248">Optional Obsidian guidance</text><text x="838" y="190">Exact source text</text><text x="838" y="219">Retrieved passage IDs</text><text x="838" y="248">Immutable run snapshot</text><text x="1058" y="190">Inspect all passages</text><text x="1058" y="219">Accept / correct / follow up</text><text x="1058" y="248">Reviewed risk indicator</text></g><g font-size="25"><text x="278" y="209">→</text><text x="538" y="209">→</text><text x="798" y="209">→</text><text x="1018" y="209">→</text></g><rect x="40" y="310" width="1200" height="110" rx="10" fill="#e1ead7"/><text x="60" y="344" font-size="20" font-weight="bold">A policy states annual access reviews. A questionnaire states contractor reviews every two years.</text><text x="60" y="375" font-size="18">Retrieve both sources, preserve their pages, and let the analyst assess policy intent versus actual practice.</text><text x="60" y="403" font-size="16">Citations establish where text came from. They do not prove implementation, a correct conclusion or framework conformity.</text></g></svg>
